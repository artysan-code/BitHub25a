name: Wikilink check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/scripts/check-wikilinks.py'
      - '.github/workflows/wikilink-check.yml'
  push:
    branches: [release]
    paths:
      - '**/*.md'
      - '.github/scripts/check-wikilinks.py'
      - '.github/workflows/wikilink-check.yml'
  workflow_dispatch:

jobs:
  wikilinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Il vault è senza wikilink rotti: si verifica tutto, non solo i file
      # modificati, così anche una rinomina che rompe link in altre note fallisce.
      - name: Verifica i wikilink interni di tutto il vault
        run: python3 .github/scripts/check-wikilinks.py --strict
