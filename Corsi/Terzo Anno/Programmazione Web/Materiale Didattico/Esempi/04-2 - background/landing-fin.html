<!DOCTYPE html>

<html>
<head>
    <title>TestBg</title>
    <style>
        *,html,body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;  
        }
        
        html,body{
            width: 100%;
            height: 100%;
            font-family: "Roboto", sans-serif;
        }
        
        #sec1{
            width: 100%;
            height: 100%;
            display: flex;
            background: url('bg-cani.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed
        }
        
        #sec1 p{
            margin: auto;
            background: #ffffff;
            opacity: 0.8;
            padding: 30px;
        }
        
        #sec2{
            width: 100%;
            height: 100%;
            display: flex;
            background: url('bg-gatti.jpg');
            background-size: cover;
            background-position: center center;
        }
        
        #sec2 p{
            margin: auto;
            background: #ffffff;
            opacity: 0.8;
            padding: 30px;
        }
        
        #sec3{
            width: 100%;
            height: 100%;
            display: flex;
            background: url('bg-cangat.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed
        }
        
        #sec3 p{
            margin: auto;
            background: #ffffff;
            opacity: 0.8;
            padding: 30px;
        }
        
    </style>
</head>

<body>
    <div id="sec1">
        <p>Cani</p>
    </div>
    <div id="sec2">
        <p>Gatti</p>
    </div>
    <div id="sec3">
        <p>Cani e gatti</p>
    </div>
</body>
</html>
