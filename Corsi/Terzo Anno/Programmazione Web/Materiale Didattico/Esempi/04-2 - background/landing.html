<!DOCTYPE html>

<html>
<head>
    <title>Prova BG</title>
    <style>
        *,html, body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body{
            width: 100%;
            height: 100%;
            font-family:  Roboto, sans-serif;
        }
        
        #sec1{
            width: 100%;
            height: 100%;
            background-image: url('bg-cani.jpg');
            background-position: center center;
            background-size: cover;
            text-align: center;
            display: flex;
        }
        
        #sec1 p{
            padding: 20px;
            background-color: #ffffff;
            opacity: 0.8;
            font-size: 25px;
            margin: auto;
        }
        
        #sec2{
            width: 100%;
            height: 100%;
            background-image: url('bg-gatti.jpg');
            background-position: center center;
            background-size: cover;
            text-align: center;
            display: flex;
            background-attachment: fixed;
        }
        
        #sec2 p{
            padding: 20px;
            background-color: #ffffff;
            opacity: 0.8;
            font-size: 25px;
            margin: auto;
        }
        
        #sec3{
            width: 100%;
            height: 100%;
            background-image: url('bg-cangat.jpg');
            background-position: center center;
            background-size: cover;
            text-align: center;
            display: flex;  
        }
        
        #sec3 p{
            padding: 20px;
            background-color: #ffffff;
            opacity: 0.8;
            font-size: 25px;
            margin: auto;
        }
        
    </style>
</head>

<body>
    <div id="sec1">
        <p>Cani</p>
    </div>
    <div id="sec2">
        <p>Gatti</p>
    </div>
    <div id="sec3">
        <p>Cani e Gatti</p>
    </div>


</body>
</html>
