<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .container {
            padding: 30px;
            min-height: 400px;
            background-color: lightsteelblue;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;

        }

        .card {
            width: 300px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        


    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod provident sit </p>
        </div>
        <div class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
        </div>
        <div class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
        </div>
    </div>
</body>
</html>
