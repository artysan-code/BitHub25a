<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="test">

    </div>
</body>
    <script>

        let mydiv = document.querySelector(".test");


        let response = fetch("https://jsonplaceholder.typicode.com/users/1");
        response.then((res) => {
            console.log(res);
            return res.json();
        }).then((data) => {
            console.log("Data received:");
            console.log(data);

            console.log(data.address.street);
            mydiv.textContent = data.address.street;
            mydiv.innerHTML = `<p>${data.address.street}</p>`;

        }).catch((err) => { 
            console.error("Error fetching data:", err);
        });
    </script>

</html>
